<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram to Pavan</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .box{
            width: 400px;
            padding: 20px;
            text-align: center;
            background-color: orange;
            margin: 20px 20px;
        }
        h1{
            margin-bottom: 25px;
            
        }

        label{
            font-weight: bold;
        }
        input{
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button{
            cursor: pointer;
            font-size: 16px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background-color: white;
        }

        #result{
            margin-top: 25px;
        }
        
    </style>
</head>

<body>

    <div class="box">
        <h2>Gram To pavan convertor</h2>
        <label>Enter Gram Value</label>
        <input type="number" id="gram" placeholder="Enter the value">
        <button onclick="convertgram()">Convert</button>
        <h2 id="result"></h2>
    </div>
    <script>
        function convertgram() {
            let gram = Number(document.getElementById('gram').value)
            let pavan = gram / 8

            document.getElementById('result').innerHTML = pavan
        }
    </script>

</body>

</html>
